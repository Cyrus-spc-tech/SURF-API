<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Management System</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-title">🏥 Patient Management System</h1>
            <div class="nav-links">
                <a href="#dashboard" class="nav-link active">Dashboard</a>
                <a href="#patients" class="nav-link">Patients</a>
                <a href="#add-patient" class="nav-link">Add Patient</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <!-- Dashboard Section -->
        <section id="dashboard" class="section active">
            <h2>Dashboard</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">👥</div>
                    <div class="stat-info">
                        <h3>Total Patients</h3>
                        <p class="stat-value" id="total-patients">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">⚖️</div>
                    <div class="stat-info">
                        <h3>Average BMI</h3>
                        <p class="stat-value" id="avg-bmi">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">✅</div>
                    <div class="stat-info">
                        <h3>Normal Weight</h3>
                        <p class="stat-value" id="normal-count">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">⚠️</div>
                    <div class="stat-info">
                        <h3>Overweight</h3>
                        <p class="stat-value" id="overweight-count">0</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Patients List Section -->
        <section id="patients" class="section">
            <div class="section-header">
                <h2>Patient Records</h2>
                <div class="controls">
                    <input type="text" id="search-input" placeholder="Search patients..." class="search-input">
                    <select id="sort-select" class="sort-select">
                        <option value="">Sort by...</option>
                        <option value="name">Name</option>
                        <option value="age">Age</option>
                        <option value="bmi">BMI</option>
                    </select>
                    <select id="order-select" class="sort-select">
                        <option value="asc">Ascending</option>
                        <option value="desc">Descending</option>
                    </select>
                    <button onclick="loadPatients()" class="btn btn-primary">Refresh</button>
                </div>
            </div>
            <div class="table-container">
                <table class="patient-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Gender</th>
                            <th>Height (m)</th>
                            <th>Weight (kg)</th>
                            <th>BMI</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="patient-table-body">
                        <!-- Patient data will be loaded here -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Add/Edit Patient Section -->
        <section id="add-patient" class="section">
            <h2 id="form-title">Add New Patient</h2>
            <form id="patient-form" class="patient-form">
                <input type="hidden" id="patient-id" value="">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Patient Name *</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="age">Age *</label>
                        <input type="number" id="age" name="age" required min="0" max="150">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="gender">Gender *</label>
                        <select id="gender" name="gender" required>
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="height">Height (meters) *</label>
                        <input type="number" id="height" name="height" required min="0.5" max="3" step="0.01">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="weight">Weight (kg) *</label>
                        <input type="number" id="weight" name="weight" required min="1" max="500" step="0.1">
                    </div>
                </div>

                <div class="form-section">
                    <h3>Address</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="city">City *</label>
                            <input type="text" id="city" name="city" required>
                        </div>
                        <div class="form-group">
                            <label for="state">State *</label>
                            <input type="text" id="state" name="state" required>
                        </div>
                        <div class="form-group">
                            <label for="pin">PIN Code *</label>
                            <input type="text" id="pin" name="pin" required pattern="[0-9]{6}">
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Patient</button>
                    <button type="button" onclick="resetForm()" class="btn btn-secondary">Reset</button>
                </div>
            </form>
        </section>
    </main>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Edit Patient</h2>
            <form id="edit-form" class="patient-form">
                <input type="hidden" id="edit-patient-id" value="">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="edit-name">Patient Name *</label>
                        <input type="text" id="edit-name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="edit-age">Age *</label>
                        <input type="number" id="edit-age" name="age" required min="0" max="150">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="edit-gender">Gender *</label>
                        <select id="edit-gender" name="gender" required>
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="edit-height">Height (meters) *</label>
                        <input type="number" id="edit-height" name="height" required min="0.5" max="3" step="0.01">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="edit-weight">Weight (kg) *</label>
                        <input type="number" id="edit-weight" name="weight" required min="1" max="500" step="0.1">
                    </div>
                </div>

                <div class="form-section">
                    <h3>Address</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="edit-city">City *</label>
                            <input type="text" id="edit-city" name="city" required>
                        </div>
                        <div class="form-group">
                            <label for="edit-state">State *</label>
                            <input type="text" id="edit-state" name="state" required>
                        </div>
                        <div class="form-group">
                            <label for="edit-pin">PIN Code *</label>
                            <input type="text" id="edit-pin" name="pin" required pattern="[0-9]{6}">
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Update Patient</button>
                    <button type="button" onclick="closeModal()" class="btn btn-secondary">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
